<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00ff88" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background with dark glass tone -->
  <rect width="32" height="32" rx="9" fill="#070a0e" />
  <rect x="1" y="1" width="30" height="30" rx="8" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- F/> Monogram -->
  <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Fira Code', monospace" font-size="14" font-weight="800" fill="url(#glowGrad)" text-anchor="middle" filter="url(#glow)">F</text>
</svg>
